<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SBI ATM (Web)</title>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial; max-width:720px; margin:2rem auto; padding:1rem; }
    h1 { color:#0a58ca }
    .btn { margin: .25rem; padding:.5rem 1rem; border-radius:6px; border:1px solid #ccc; background:#f5f5f5; cursor:pointer }
    .btn.primary { background:#0a58ca; color:white; border-color:#0647a6 }
    #form { margin-top:1rem }
    label { display:block; margin:.5rem 0 .25rem }
    input[type="text"], input[type="number"], input[type="password"] { padding:.5rem; width:100%; box-sizing:border-box }
    .message { margin-top:1rem; padding:.5rem; border-radius:6px }
    .message.ok { background:#e6f4ea; color:#0a662a }
    .message.err { background:#ffe6e6; color:#a10000 }
  </style>
</head>
<body>
  <h1>SBI ATM — Web Demo</h1>
  <p>This is a browser port of the CLI ATM. Your PIN and balance are stored locally in your browser (localStorage). This is suitable for quick demo and easy Vercel deployment.</p>

  <div id="menu">
    <button class="btn primary" data-action="create">Create PIN</button>
    <button class="btn" data-action="deposit">Deposit</button>
    <button class="btn" data-action="withdraw">Withdraw</button>
    <button class="btn" data-action="balance">Check Balance</button>
    <button class="btn" data-action="change">Change PIN</button>
    <button class="btn" data-action="reset">Reset (clear local data)</button>
  </div>

  <div id="form"></div>
  <div id="out" class="message" style="display:none"></div>

  <script src="app.js"></script>
</body>
</html>
